<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hümeyra İçin ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020105; font-family: 'Segoe UI', Tahoma, sans-serif; }
        canvas { display: block; }
        
        /* Ekran Üstündeki Cam Efektli Ultra Net Kart */
        #ui-container {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 100;
            background: rgba(12, 4, 24, 0.85);
            padding: 16px 36px;
            border-radius: 25px;
            border: 2px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.6), inset 0 0 15px rgba(255, 105, 180, 0.2);
            backdrop-filter: blur(12px);
            width: 85%;
            max-width: 480px;
        }

        #ui-container h1 {
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 12px #ff1493, 0 0 24px #ff1493, 0 0 36px #ff69b4;
            font-weight: 800;
        }

        #ui-container p {
            font-size: 1rem;
            margin: 8px 0 0 0;
            color: #fff0f5;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 192, 203, 0.9);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div id="ui-container">
    <h1>HÜMEYRA</h1>
    <p>Çekim kuvvetine kapıldığım tek evrensin... ✨</p>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.03;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    // --- 3D Odaklı Parlak "HÜMEYRA" Metin Tabelası ---
    function createTextSprite(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = '900 85px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Katmanlı Çift Parlama Efekti
        ctx.shadowColor = '#ff007f';
        ctx.shadowBlur = 35;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        ctx.shadowColor = '#ff69b4';
        ctx.shadowBlur = 15;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ 
            map: texture, 
            transparent: true,
            blending: THREE.AdditiveBlending 
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(32, 8, 1);
        return sprite;
    }

    const nameSprite = createTextSprite("✨ HÜMEYRA ✨");
    nameSprite.position.set(0, 11, 0);
    scene.add(nameSprite);

    // --- METEOR YAĞMURU SİSTEMİ ---
    const meteorCount = 60;
    const meteorLines = [];
    const meteorGroup = new THREE.Group();
    scene.add(meteorGroup);

    for (let i = 0; i < meteorCount; i++) {
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(6); // Başlangıç ve Bitiş noktaları (Çizgi)
        
        // Rastgele gökyüzü konumları
        const startX = (Math.random() - 0.5) * 160;
        const startY = 40 + Math.random() * 60;
        const startZ = (Math.random() - 0.5) * 160;
        
        const length = 4 + Math.random() * 8; // Meteor kuyruk uzunluğu
        
        // Çapraz akış yönü
        positions[0] = startX;
        positions[1] = startY;
        positions[2] = startZ;
        positions[3] = startX - length * 0.6;
        positions[4] = startY - length;
        positions[5] = startZ - length * 0.4;

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.LineBasicMaterial({
            color: new THREE.Color().setHSL(0.9, 1.0, 0.7), // Parlak pembe/altın
            transparent: true,
            opacity: 0.2 + Math.random() * 0.8,
            blending: THREE.AdditiveBlending,
            linewidth: 2
        });

        const line = new THREE.Line(geometry, material);
        line.userData = {
            speed: 0.8 + Math.random() * 1.2,
            startY: startY,
            length: length
        };

        meteorLines.push(line);
        meteorGroup.add(line);
    }

    // --- ARKA PLAN KALP PARÇACIKLARI ---
    const heartsCount = 1000;
    const heartsGeo = new THREE.BufferGeometry();
    const heartPositions = new Float32Array(heartsCount * 3);

    for (let i = 0; i < heartsCount * 3; i += 3) {
        heartPositions[i] = (Math.random() - 0.5) * 180;
        heartPositions[i + 1] = (Math.random() - 0.5) * 180;
        heartPositions[i + 2] = (Math.random() - 0.5) * 180;
    }

    heartsGeo.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));

    const createHeartTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ff2a75';
        ctx.beginPath();
        ctx.moveTo(32, 20);
        ctx.bezierCurveTo(32, 17, 27, 10, 17, 10);
        ctx.bezierCurveTo(7, 10, 7, 24.5, 7, 24.5);
        ctx.bezierCurveTo(7, 34, 17, 44, 32, 54);
        ctx.bezierCurveTo(47, 44, 57, 34, 57, 24.5);
        ctx.bezierCurveTo(57, 24.5, 57, 10, 47, 10);
        ctx.bezierCurveTo(39, 10, 32, 17, 32, 20);
        ctx.fill();
        return new THREE.CanvasTexture(canvas);
    };

    const heartsMat = new THREE.PointsMaterial({
        size: 1.8,
        map: createHeartTexture(),
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const heartParticles = new THREE.Points(heartsGeo, heartsMat);
    scene.add(heartParticles);

    // --- NOISE VE KARA DELİK YAPISI ---
    const noiseChunk = `
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
    `;

    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    const bhMat = new THREE.MeshBasicMaterial({ color: 0x050005 });
    const bhGeo = new THREE.SphereGeometry(4, 64, 64);
    coreGroup.add(new THREE.Mesh(bhGeo, bhMat));

    const auraMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uIntensity: { value: 1.2 } },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vView = normalize(-(modelViewMatrix * vec4(position, 1.0)).xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uIntensity;
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                float rim = pow(1.0 - max(dot(vNormal, vView), 0.0), 3.5);
                gl_FragColor = vec4(vec3(1.0, 0.15, 0.55) * rim * uIntensity * 4.0, 1.0);
            }
        `,
        side: THREE.BackSide,
        transparent: true,
        blending: THREE.AdditiveBlending
    });

    coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(4.3, 64, 64), auraMat));

    const instanceCount = 5500;
    const streakGeo = new THREE.CylinderGeometry(0.01, 0.14, 2.5, 3);
    streakGeo.rotateX(Math.PI / 2);

    const diskMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMorph: { value: 0.12 },
            uCompression: { value: 1.0 },
            uIntensity: { value: 1.2 },
            uOrbitScale: { value: 1.0 }
        },
        vertexShader: `
            ${noiseChunk}
            uniform float uTime;
            uniform float uMorph;
            uniform float uCompression;
            uniform float uIntensity;
            uniform float uOrbitScale;
            varying vec3 vColor;
            varying float vOpacity;

            void main() {
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                float rOriginal = length(instPos.xz);
                float r = rOriginal * uCompression;
                float initialAngle = atan(instPos.z, instPos.x);
                float orbitalVelocity = (1.5 / sqrt(rOriginal)) * uOrbitScale;
                float currentAngle = initialAngle + (uTime * orbitalVelocity);
                vec3 morphedWorldPos = vec3(cos(currentAngle) * r, instPos.y, sin(currentAngle) * r);
                float noise = snoise(vec3(morphedWorldPos.x * 0.08, morphedWorldPos.z * 0.08, uTime * uMorph));
                morphedWorldPos.y += noise * uMorph * 4.0;
                vec3 viewDir = normalize(cameraPosition - morphedWorldPos);
                vec3 orbitDir = normalize(vec3(-sin(currentAngle), 0.0, cos(currentAngle)));
                float doppler = dot(orbitDir, viewDir);
                
                vec3 hot = vec3(1.0, 0.9, 0.65);
                vec3 warm = vec3(1.0, 0.18, 0.48);
                vec3 cool = vec3(0.5, 0.05, 0.65);
                
                vec3 color = mix(cool, warm, smoothstep(45.0, 12.0, r));
                color = mix(color, hot, smoothstep(10.0, 4.0, r));
                vColor = color * (1.2 + doppler * 0.5) * uIntensity;
                vOpacity = (smoothstep(3.8, 5.5, r) * (1.0 - smoothstep(38.0, 48.0, r))) * 0.85;

                float deltaAngle = currentAngle - initialAngle;
                float c = cos(deltaAngle);
                float s = sin(deltaAngle);
                mat3 rotY = mat3(
                    c, 0, s,
                    0, 1, 0,
                   -s, 0, c
                );
                vec3 localPos = (instanceMatrix * vec4(position, 0.0)).xyz;
                vec3 rotatedLocalPos = rotY * localPos;
                gl_Position = projectionMatrix * viewMatrix * vec4(morphedWorldPos + rotatedLocalPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const instancedDisk = new THREE.InstancedMesh(streakGeo, diskMaterial, instanceCount);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < instanceCount; i++) {
        const r = 5 + Math.pow(Math.random(), 1.3) * 40;
        const angle = Math.random() * Math.PI * 2;
        dummy.position.set(Math.cos(angle) * r, (Math.random() - 0.5) * (8 / r), Math.sin(angle) * r);
        dummy.lookAt(dummy.position.x + Math.sin(angle), dummy.position.y, dummy.position.z - Math.cos(angle));
        dummy.updateMatrix();
        instancedDisk.setMatrixAt(i, dummy.matrix);
    }

    scene.add(instancedDisk);

    // --- ANİMASYON DÖNGÜSÜ ---
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        diskMaterial.uniforms.uTime.value = time;
        auraMat.uniforms.uTime.value = time;
        
        // 3D Hümeyra yazısının tatlı sallantısı
        nameSprite.position.y = 11 + Math.sin(time * 2) * 0.6;
        
        // Meteor Yağmuru Hareketi
        meteorLines.forEach(line => {
            const pos = line.geometry.attributes.position.array;
            
            // Meteor aşağı ve çapraz kaysın
            pos[0] -= line.userData.speed * 0.6;
            pos[1] -= line.userData.speed;
            pos[2] -= line.userData.speed * 0.4;
            pos[3] -= line.userData.speed * 0.6;
            pos[4] -= line.userData.speed;
            pos[5] -= line.userData.speed * 0.4;

            // Ekranın altına düşen meteoru tekrar yukarıya taşı
            if (pos[1] < -40) {
                const newStartX = (Math.random() - 0.5) * 160;
                const newStartY = 50 + Math.random() * 40;
                const newStartZ = (Math.random() - 0.5) * 160;
                
                pos[0] = newStartX;
                pos[1] = newStartY;
                pos[2] = newStartZ;
                pos[3] = newStartX - line.userData.length * 0.6;
                pos[4] = newStartY - line.userData.length;
                pos[5] = newStartZ - line.userData.length * 0.4;
            }

            line.geometry.attributes.position.needsUpdate = true;
        });

        heartParticles.rotation.y = time * 0.02;

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
